<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C51A20"/>
      <stop offset="38%" stop-color="#A30C11"/>
      <stop offset="100%" stop-color="#7D070B"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F8F9"/>
      <stop offset="100%" stop-color="#DDE2E6"/>
    </linearGradient>

    <radialGradient id="centerGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E2E5E8"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F6F7F8"/>
      <stop offset="100%" stop-color="#C8CDD2"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <clipPath id="outerClip">
      <circle cx="512" cy="512" r="490"/>
    </clipPath>
  </defs>

  <!-- Transparent canvas -->

  <!-- Lifebuoy segments -->
  <path d="M 626.39,35.54 A 490,490 0 0 1 915.82,234.46 L 775.72,330.75 A 320,320 0 0 0 586.70,200.84 Z" fill="url(#redGrad)" stroke="#8A090E" stroke-width="3" filter="url(#softShadow)"/><path d="M 929.79,255.98 A 490,490 0 0 1 993.79,601.30 L 826.64,570.32 A 320,320 0 0 0 784.84,344.80 Z" fill="url(#whiteGrad)" stroke="#D8DDE1" stroke-width="3" filter="url(#softShadow)"/><path d="M 988.46,626.39 A 490,490 0 0 1 789.54,915.82 L 693.25,775.72 A 320,320 0 0 0 823.16,586.70 Z" fill="url(#redGrad)" stroke="#8A090E" stroke-width="3" filter="url(#softShadow)"/><path d="M 768.02,929.79 A 490,490 0 0 1 422.70,993.79 L 453.68,826.64 A 320,320 0 0 0 679.20,784.84 Z" fill="url(#whiteGrad)" stroke="#D8DDE1" stroke-width="3" filter="url(#softShadow)"/><path d="M 397.61,988.46 A 490,490 0 0 1 108.18,789.54 L 248.28,693.25 A 320,320 0 0 0 437.30,823.16 Z" fill="url(#redGrad)" stroke="#8A090E" stroke-width="3" filter="url(#softShadow)"/><path d="M 94.21,768.02 A 490,490 0 0 1 30.21,422.70 L 197.36,453.68 A 320,320 0 0 0 239.16,679.20 Z" fill="url(#whiteGrad)" stroke="#D8DDE1" stroke-width="3" filter="url(#softShadow)"/><path d="M 35.54,397.61 A 490,490 0 0 1 234.46,108.18 L 330.75,248.28 A 320,320 0 0 0 200.84,437.30 Z" fill="url(#redGrad)" stroke="#8A090E" stroke-width="3" filter="url(#softShadow)"/><path d="M 255.98,94.21 A 490,490 0 0 1 601.30,30.21 L 570.32,197.36 A 320,320 0 0 0 344.80,239.16 Z" fill="url(#whiteGrad)" stroke="#D8DDE1" stroke-width="3" filter="url(#softShadow)"/>

  <!-- Outer polished rim -->
  <circle cx="512" cy="512" r="492" fill="none" stroke="url(#rimGrad)" stroke-width="9"/>
  <circle cx="512" cy="512" r="484" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>

  <!-- Gloss highlights on red ring -->
  <g clip-path="url(#outerClip)" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-linecap="round">
    <path d="M 660 54 A 470 470 0 0 1 875 184" stroke-width="13"/>
    <path d="M 125 278 A 470 470 0 0 1 88 516" stroke-width="11"/>
    <path d="M 740 923 A 470 470 0 0 1 901 760" stroke-width="10"/>
    <path d="M 247 929 A 470 470 0 0 1 78 718" stroke-width="9"/>
  </g>

  <!-- Inner recessed plate -->
  <circle cx="512" cy="512" r="314" fill="url(#centerGrad)" stroke="#C9CDD1" stroke-width="11" filter="url(#innerShadow)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.96"/>

  <!-- Text -->
  <text x="512" y="525"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="190"
        font-weight="800"
        letter-spacing="-4"
        fill="#A30C11">SOS</text>

  <text x="512" y="655"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="106"
        font-weight="800"
        letter-spacing="3"
        fill="#A30C11">CRM</text>
</svg>
